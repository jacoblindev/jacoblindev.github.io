# Build the VitePress site; publish it to GitHub Pages only from main.
# Based on https://vitepress.dev/guide/deploy#github-pages
#
#   pull request into main → build only, as a check (nothing is published)
#   push to main (a merge) → build + deploy
#
# Work happens on a branch named after its studio folder (post/<slug>,
# site/<slug>); pushing a branch runs nothing, opening the PR runs the check.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, never cancelled mid-flight. PR checks get their own
# group per branch, and a newer push to the same PR cancels the stale check.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the site's Pages settings
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: lastUpdated / TitleBlock date read git log
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
