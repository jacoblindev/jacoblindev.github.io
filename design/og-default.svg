<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <!-- Default link-preview card (og:image), 1200×627 = LinkedIn's 1.91:1.
       Blueprint palette from docs/.vitepress/theme/style/vars.css (dark).
       Grid is the site's 20px / 100px grid, a touch stronger so it survives
       being shrunk into a feed. Rendered at 2x (2400×1254): LinkedIn often
       shows link cards as a ~160px thumbnail, so the title is sized to stay
       legible there and the title block is quieter. Render: design/render.sh -->
  <defs>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minor)"/>
      <path d="M100 0H0V100" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="627" fill="#0B1C2C"/>
  <rect width="1200" height="627" fill="url(#major)"/>

  <!-- Sheet frame, 45° chamfer top-right like the site's cards -->
  <path d="M40 40 H1120 L1160 80 V587 H40 Z" fill="none" stroke="#38BDF8" stroke-width="2"/>

  <!-- Registration mark -->
  <g stroke="#38BDF8" stroke-width="2">
    <path d="M80 100 H112 M96 84 V116"/>
    <circle cx="96" cy="100" r="9" fill="none"/>
  </g>

  <!-- Title -->
  <text x="76" y="300" font-family="'JetBrains Mono', monospace" font-weight="700"
        font-size="168" letter-spacing="2" fill="#E6EEF8">JLNOTES</text>
  <!-- Dimension line under the title -->
  <g stroke="#38BDF8" stroke-width="3">
    <path d="M80 334 H794"/>
    <path d="M80 322 V346 M794 322 V346"/>
  </g>
  <text x="80" y="398" font-family="'JetBrains Mono', monospace" font-size="32" fill="#B0C4DE">Notes on software development —</text>
  <text x="80" y="442" font-family="'JetBrains Mono', monospace" font-size="32" fill="#B0C4DE">things I build, break and learn.</text>

  <!-- Title block, as in the site's TitleBlock footer -->
  <g font-family="'JetBrains Mono', monospace" opacity="0.7">
    <path d="M40 487 H1160 M360 487 V587 M900 487 V587" stroke="#38BDF8" stroke-width="2" fill="none"/>
    <text x="68"  y="522" font-size="16" letter-spacing="2" fill="#64748B">PROJECT</text>
    <text x="68"  y="560" font-size="26" fill="#E6EEF8">JLNotes</text>
    <text x="388" y="522" font-size="16" letter-spacing="2" fill="#64748B">SHEET / PATH</text>
    <text x="388" y="560" font-size="26" fill="#E6EEF8">jacoblindev.github.io</text>
    <text x="928" y="522" font-size="16" letter-spacing="2" fill="#64748B">REV</text>
    <text x="928" y="560" font-size="26" fill="#E6EEF8">v1.0</text>
  </g>
</svg>
